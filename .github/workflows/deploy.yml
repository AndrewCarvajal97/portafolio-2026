name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required permissions for GitHub Pages OIDC deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Cancel any in-progress deploy so we always publish the latest commit.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Enable Corepack so the exact pnpm version pinned in `packageManager`
      # (package.json) is used. No need to install pnpm separately.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Security audit (fail on high severity)
        run: pnpm audit --audit-level=high
        # Don't block deploys on moderate/low. Use `pnpm run audit` locally
        # for the stricter check.
        continue-on-error: true

      - name: Optimize images (.webp + .avif)
        run: pnpm run optimize:images

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages on the repo if it's not enabled yet.
          # Avoids the chicken-and-egg "Get Pages site failed" error.
          enablement: true

      - name: Build with Astro
        run: pnpm run build
        env:
          SITE: https://pablocarvajal.dev

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
