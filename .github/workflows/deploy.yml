name: Deploy to GitHub Pages

on:
  # Run on every push to main
  push:
    branches: [main]
  # Allow manual triggering from the Actions tab
  workflow_dispatch:

# Required permissions for the GitHub Pages deployment action (OIDC).
permissions:
  contents: read
  pages: write
  id-token: write

# Cancel any in-progress deploy when a new commit lands so we always publish the latest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Optimize images (.webp + .avif)
        run: npm run optimize:images

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build with Astro
        run: npm run build
        env:
          # Astro reads site from astro.config.mjs; this is here as a backup
          # in case you ever want to override per-environment.
          SITE: https://pablocarvajal.dev

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
